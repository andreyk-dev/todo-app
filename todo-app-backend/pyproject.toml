[project]
name = "todo-app-backend"
version = "0.1.0"
requires-python = ">=3.12"

[tool.ruff]
line-length = 88
exclude = [
    ".git",
    ".venv",
    "alembic",
]

[tool.ruff.lint]
select = ["E", "W", "F", "I"]
ignore = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.mypy]
python_version = "3.12"

disallow_untyped_defs = false

ignore_missing_imports = true

warn_unused_ignores = true

explicit_package_bases = true
